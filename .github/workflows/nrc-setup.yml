name: Prepare NRC integration

on:
  push:
    branches: [nrc-outdoor]
    paths: [.github/workflows/nrc-setup.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Apply NRC integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = json.loads(r'''{"scripts/nike_data.py":"\"\"\"Adapt NRC metrics to the unchanged running_page Activity contract.\nNike endpoints and metric units follow upstream run_page/nike_sync.py.\n\"\"\"\nimport math\nimport uuid\nfrom datetime import UTC, datetime, timedelta\nfrom xml.etree import ElementTree as ET\nfrom zoneinfo import ZoneInfo\n\n\ndef number(value, label, positive=False):\n    if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):\n        raise ValueError(label + \" must be a finite number\")\n    if positive and value <= 0:\n        raise ValueError(label + \" must be positive\")\n    return value\n\n\ndef metric_values(activity, kind):\n    values = {}\n    for metric in activity.get(\"metrics\", []):\n        if metric.get(\"type\") == kind:\n            for point in metric.get(\"values\", []):\n                stamp, value = point.get(\"start_epoch_ms\"), point.get(\"value\")\n                if isinstance(stamp, (int, float)) and not isinstance(stamp, bool):\n                    values[stamp] = value\n    return values\n\n\ndef coordinates(activity):\n    latitudes = metric_values(activity, \"latitude\")\n    longitudes = metric_values(activity, \"longitude\")\n    result = []\n    for stamp in sorted(latitudes.keys() & longitudes.keys()):\n        lat, lon = latitudes[stamp], longitudes[stamp]\n        try:\n            number(lat, \"Latitude\")\n            number(lon, \"Longitude\")\n        except ValueError:\n            continue\n        if -90 <= lat <= 90 and -180 <= lon <= 180:\n            result.append((stamp, lat, lon))\n    return result\n\n\ndef encode_polyline(points):\n    encoded, previous = [], [0, 0]\n    for point in points:\n        for axis, value in enumerate(point):\n            current = math.floor(value * 100000 + 0.5)\n            delta = current - previous[axis]\n            previous[axis] = current\n            delta = ~(delta << 1) if delta < 0 else delta << 1\n            while delta >= 0x20:\n                encoded.append(chr((0x20 | (delta & 0x1F)) + 63))\n                delta >>= 5\n            encoded.append(chr(delta + 63))\n    return \"\".join(encoded)\n\n\ndef normalize_nike(activity):\n    try:\n        activity_id = str(uuid.UUID(activity[\"id\"]))\n    except (KeyError, ValueError, AttributeError, TypeError) as error:\n        raise ValueError(\"Invalid Nike activity ID\") from error\n    if activity.get(\"type\") not in {\"run\", \"jogging\"}:\n        raise ValueError(\"Nike activity must be a run\")\n    start = number(activity.get(\"start_epoch_ms\"), \"Start timestamp\", True)\n    end = number(activity.get(\"end_epoch_ms\"), \"End timestamp\", True)\n    duration = number(activity.get(\"active_duration_ms\"), \"Active duration\", True)\n    if end <= start or end != int(end) or end > 9007199254740991:\n        raise ValueError(\"Invalid Nike activity time range\")\n    summaries = {item[\"metric\"]: item.get(\"value\") for item in activity.get(\"summaries\", [])}\n    distance = number(summaries.get(\"distance\"), \"Distance\", True) * 1000\n    seconds = math.floor(duration / 1000 + 0.5)\n    if seconds < 1:\n        raise ValueError(\"Nike duration rounds to zero\")\n    started = datetime.fromtimestamp(start / 1000, UTC)\n    local = started.astimezone(ZoneInfo(\"America/New_York\")).replace(tzinfo=None)\n    points = coordinates(activity)\n    heart_rate = summaries.get(\"heart_rate\")\n    if heart_rate is not None:\n        number(heart_rate, \"Heart rate\", True)\n    ascent = summaries.get(\"ascent\")\n    if ascent is not None:\n        number(ascent, \"Ascent\")\n        if ascent < 0:\n            raise ValueError(\"Ascent must be nonnegative\")\n    steps = summaries.get(\"steps\")\n    if steps is not None:\n        number(steps, \"Steps\")\n        if steps < 0 or steps != int(steps):\n            raise ValueError(\"Steps must be a nonnegative integer\")\n    tags = activity.get(\"tags\", {})\n    return {\n        \"run_id\": int(end), \"record_id\": \"NRC:\" + activity_id,\n        \"nike_activity_id\": activity_id,\n        \"name\": tags.get(\"com.nike.name\") or \"NRC outdoor run\",\n        \"type\": \"Run\", \"subtype\": \"Run\", \"source\": \"nike\",\n        \"distance\": round(distance, 6),\n        \"moving_time\": f\"{seconds // 3600}:{seconds % 3600 // 60:02d}:{seconds % 60:02d}\",\n        \"start_date\": started.isoformat(timespec=\"seconds\").replace(\"+00:00\", \"Z\"),\n        \"start_date_local\": local.isoformat(timespec=\"seconds\"), \"date_precision\": \"minute\",\n        \"summary_polyline\": encode_polyline([(p[1], p[2]) for p in points]) if len(points) >= 2 else None,\n        \"location_country\": None, \"average_heartrate\": heart_rate,\n        \"average_speed\": distance / seconds, \"elevation_gain\": ascent,\n        \"running_steps\": int(steps) if steps is not None else None,\n        \"streak\": 1, \"workout_details\": None, \"notes\": \"Recorded with Nike Run Club\",\n    }\n\n\ndef gpx_document(activity):\n    points = coordinates(activity)\n    if len(points) < 2:\n        return None\n    namespace = \"http://www.topografix.com/GPX/1/1\"\n    ET.register_namespace(\"\", namespace)\n    root = ET.Element(\"{\" + namespace + \"}gpx\", version=\"1.1\", creator=\"running_page NRC\")\n    track = ET.SubElement(root, \"{\" + namespace + \"}trk\")\n    ET.SubElement(track, \"{\" + namespace + \"}name\").text = activity.get(\"tags\", {}).get(\"com.nike.name\") or \"NRC run\"\n    segment = ET.SubElement(track, \"{\" + namespace + \"}trkseg\")\n    elevations = metric_values(activity, \"elevation\")\n    for stamp, lat, lon in points:\n        point = ET.SubElement(segment, \"{\" + namespace + \"}trkpt\", lat=str(lat), lon=str(lon))\n        elevation = elevations.get(stamp)\n        if isinstance(elevation, (int, float)) and math.isfinite(elevation):\n            ET.SubElement(point, \"{\" + namespace + \"}ele\").text = str(elevation)\n        ET.SubElement(point, \"{\" + namespace + \"}time\").text = datetime.fromtimestamp(stamp / 1000, UTC).isoformat(timespec=\"milliseconds\").replace(\".000+00:00\", \"Z\").replace(\"+00:00\", \"Z\")\n    return ET.tostring(root, encoding=\"unicode\", xml_declaration=True)\n\n\ndef merge_activities(indoor, nike):\n    if not isinstance(nike, list):\n        raise ValueError(\"Nike dataset must be a list\")\n    ids, records, rows = set(), set(), []\n    for row in nike:\n        if not isinstance(row, dict) or row.get(\"source\") != \"nike\" or not str(row.get(\"record_id\", \"\")).startswith(\"NRC:\"):\n            raise ValueError(\"Invalid cached Nike record\")\n        number(row.get(\"distance\"), \"Cached Nike distance\", True)\n        number(row.get(\"average_speed\"), \"Cached Nike speed\", True)\n        datetime.fromisoformat(row[\"start_date_local\"])\n    for original in indoor + nike:\n        row = original.copy()\n        run_id, record_id = row[\"run_id\"], row[\"record_id\"]\n        number(run_id, \"Run ID\", True)\n        if run_id != int(run_id) or run_id > 9007199254740991:\n            raise ValueError(\"Run ID must be a safe integer\")\n        if run_id in ids or record_id in records:\n            raise ValueError(\"Duplicate running record or numeric ID\")\n        ids.add(run_id)\n        records.add(record_id)\n        rows.append(row)\n    rows.sort(key=lambda row: (row[\"start_date_local\"], row[\"run_id\"]))\n    previous, streak = None, 0\n    for row in rows:\n        day = datetime.fromisoformat(row[\"start_date_local\"]).date()\n        if day != previous:\n            streak = streak + 1 if previous and day == previous + timedelta(days=1) else 1\n        row[\"streak\"] = streak\n        previous = day\n    return list(reversed(rows))\n","scripts/sync_nike.py":"\"\"\"Download your own NRC runs using the original project's Nike API endpoints.\"\"\"\nimport json\nimport os\nimport sys\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\n\nfrom import_excel import write_json\nfrom nike_data import gpx_document, normalize_nike\n\nBASE_URL = \"https://api.nike.com/plus/v3/\"\nROOT = Path(__file__).resolve().parents[1]\nCACHE = ROOT / \"src/static/nike-activities.json\"\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, *args, **kwargs):\n        return None\n\n\ndef download_runs(token):\n    opener = urllib.request.build_opener(NoRedirect)\n    def request(resource):\n        req = urllib.request.Request(BASE_URL + resource, headers={\"Authorization\": \"Bearer \" + token, \"Accept\": \"application/json\"})\n        try:\n            with opener.open(req, timeout=45) as response:\n                return json.load(response)\n        except urllib.error.HTTPError as error:\n            raise ValueError(f\"Nike API returned HTTP {error.code}; update NIKE_ACCESS_TOKEN if authorization expired\") from None\n        except urllib.error.URLError:\n            raise ValueError(\"Could not reach Nike API; the previous dataset was preserved\") from None\n    cursor, pages, seen, raw_runs = \"*\", set(), set(), []\n    while cursor:\n        if cursor in pages:\n            raise ValueError(\"Nike pagination repeated; preserving previous dataset\")\n        pages.add(cursor)\n        page = request(\"activities/before_id/v3/\" + urllib.parse.quote(cursor, safe=\"*\") + \"?limit=30&types=run%2Cjogging&include_deleted=false\")\n        if not isinstance(page.get(\"activities\"), list):\n            raise ValueError(\"Nike returned an invalid activity list\")\n        for summary in page[\"activities\"]:\n            activity_id = str(summary[\"id\"])\n            if activity_id in seen:\n                continue\n            seen.add(activity_id)\n            if summary.get(\"app_id\") in {\"com.nike.ntc.brand.ios\", \"com.nike.ntc.brand.droid\"}:\n                continue\n            raw = request(\"activity/\" + urllib.parse.quote(activity_id, safe=\"\") + \"?metrics=ALL\")\n            if raw.get(\"delete_indicator\") in (True, 1, \"true\"):\n                continue\n            if raw.get(\"type\") in {\"run\", \"jogging\"}:\n                raw_runs.append(raw)\n        cursor = page.get(\"paging\", {}).get(\"before_id\")\n    return raw_runs\n\n\ndef main():\n    token = os.environ.get(\"NIKE_ACCESS_TOKEN\", \"\").strip()\n    if not token:\n        print(\"NIKE_ACCESS_TOKEN repository secret is required\", file=sys.stderr)\n        return 1\n    try:\n        raw_runs = download_runs(token)\n        rows = [normalize_nike(raw) for raw in raw_runs]\n        if not rows:\n            raise ValueError(\"Nike returned no completed runs; preserving previous dataset\")\n        rows.sort(key=lambda row: (row[\"start_date_local\"], row[\"run_id\"]), reverse=True)\n        # Download and validate every run before modifying any persisted input.\n        archives = []\n        allowed = {\"id\", \"type\", \"app_id\", \"start_epoch_ms\", \"end_epoch_ms\", \"active_duration_ms\", \"summaries\", \"tags\", \"metrics\"}\n        for raw, row in zip(raw_runs, [normalize_nike(raw) for raw in raw_runs]):\n            archive = {key: value for key, value in raw.items() if key in allowed}\n            archives.append((row[\"nike_activity_id\"], archive, gpx_document(raw)))\n        for activity_id, archive, gpx in archives:\n            write_json(ROOT / \"activities\" / (\"nike-\" + activity_id + \".json\"), archive)\n            if gpx is not None:\n                path = ROOT / \"GPX_OUT\" / (\"nike-\" + activity_id + \".gpx\")\n                path.parent.mkdir(parents=True, exist_ok=True)\n                path.write_text(gpx, encoding=\"utf-8\")\n        write_json(CACHE, rows)\n    except (ValueError, KeyError, TypeError, OSError) as error:\n        print(\"NRC import failed: \" + str(error), file=sys.stderr)\n        return 1\n    print(f\"Saved {len(rows)} NRC runs; {sum(bool(row['summary_polyline']) for row in rows)} with GPS routes\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n","scripts/tests/test_nike_import.py":"import copy\nimport json\nimport subprocess\nimport sys\nimport tempfile\nimport unittest\nfrom datetime import UTC, datetime\nfrom pathlib import Path\nfrom xml.etree import ElementTree as ET\n\nROOT = Path(__file__).resolve().parents[2]\nsys.path.insert(0, str(ROOT / \"scripts\"))\nfrom nike_data import encode_polyline, gpx_document, merge_activities, normalize_nike\n\nSTART = int(datetime(2026, 10, 28, 2, tzinfo=UTC).timestamp() * 1000)\n\ndef example():\n    return {\n        \"id\": \"11111111-1111-4111-8111-111111111111\",\n        \"type\": \"run\", \"app_id\": \"com.nike.sport.running.ios\",\n        \"start_epoch_ms\": START, \"end_epoch_ms\": START + 610000,\n        \"active_duration_ms\": 600500,\n        \"summaries\": [{\"metric\": \"distance\", \"value\": 1.609344},\n                      {\"metric\": \"ascent\", \"value\": 12.5},\n                      {\"metric\": \"steps\", \"value\": 1000}],\n        \"tags\": {\"com.nike.name\": \"Evening outdoor run\"},\n        \"metrics\": [\n            {\"type\": \"latitude\", \"values\": [\n                {\"start_epoch_ms\": START + i * 1000, \"value\": v}\n                for i, v in enumerate([38.5, 40.7, 43.252])]},\n            {\"type\": \"longitude\", \"values\": [\n                {\"start_epoch_ms\": START + i * 1000, \"value\": v}\n                for i, v in enumerate([-120.2, -120.95, -126.453])]},\n        ],\n    }\n\nclass NikeImportTests(unittest.TestCase):\n    def test_nrc_units_active_duration_new_york_date_and_missing_heart_rate(self):\n        row = normalize_nike(example())\n        self.assertAlmostEqual(row[\"distance\"], 1609.344)\n        self.assertEqual(row[\"moving_time\"], \"0:10:01\")\n        self.assertEqual(row[\"start_date_local\"], \"2026-10-27T22:00:00\")\n        self.assertEqual(row[\"start_date\"], \"2026-10-28T02:00:00Z\")\n        self.assertEqual(row[\"source\"], \"nike\")\n        self.assertEqual(row[\"name\"], \"Evening outdoor run\")\n        self.assertEqual(row[\"running_steps\"], 1000)\n        self.assertEqual(row[\"elevation_gain\"], 12.5)\n        self.assertIsNone(row[\"average_heartrate\"])\n        self.assertAlmostEqual(row[\"average_speed\"], 1609.344 / 601)\n\n    def test_gps_matches_google_polyline_reference_and_exports_timed_gpx(self):\n        expected = \"_p~iF~ps|U_ulLnnqC_mqNvxq`@\"\n        row = normalize_nike(example())\n        self.assertEqual(row[\"summary_polyline\"], expected)\n        self.assertEqual(encode_polyline([(38.5, -120.2), (40.7, -120.95), (43.252, -126.453)]), expected)\n        document = ET.fromstring(gpx_document(example()))\n        points = document.findall(\".//{http://www.topografix.com/GPX/1/1}trkpt\")\n        self.assertEqual(len(points), 3)\n        self.assertEqual(float(points[0].attrib[\"lat\"]), 38.5)\n        self.assertEqual(float(points[0].attrib[\"lon\"]), -120.2)\n        self.assertEqual(points[0].find(\"{http://www.topografix.com/GPX/1/1}time\").text, \"2026-10-28T02:00:00Z\")\n\n    def test_coordinates_join_by_timestamp_and_no_route_is_invented(self):\n        raw = example()\n        raw[\"metrics\"][1][\"values\"].pop(1)\n        points = ET.fromstring(gpx_document(raw)).findall(\".//{http://www.topografix.com/GPX/1/1}trkpt\")\n        self.assertEqual(len(points), 2)\n        self.assertEqual(float(points[1].attrib[\"lat\"]), 43.252)\n        self.assertEqual(float(points[1].attrib[\"lon\"]), -126.453)\n        raw[\"metrics\"] = []\n        self.assertIsNone(normalize_nike(raw)[\"summary_polyline\"])\n        self.assertIsNone(gpx_document(raw))\n\n    def test_invalid_measurements_are_rejected(self):\n        for key, value in [(\"active_duration_ms\", 0), (\"start_epoch_ms\", None)]:\n            raw = example()\n            raw[key] = value\n            with self.subTest(key=key), self.assertRaises(ValueError):\n                normalize_nike(raw)\n        raw = example()\n        raw[\"summaries\"][0][\"value\"] = float(\"nan\")\n        with self.assertRaises(ValueError):\n            normalize_nike(raw)\n\n    def test_merging_is_idempotent_and_preserves_indoor_missing_gps(self):\n        nike = normalize_nike(example())\n        indoor = copy.deepcopy(nike)\n        indoor.update(run_id=1, record_id=\"R0001\", source=\"manual_excel_treadmill\", name=\"Treadmill · Easy\", summary_polyline=None)\n        merged = merge_activities([indoor], [nike])\n        self.assertEqual(len(merged), 2)\n        self.assertEqual(merged, merge_activities([indoor], [nike]))\n        self.assertIsNone(next(row for row in merged if row[\"record_id\"] == \"R0001\")[\"summary_polyline\"])\n        with self.assertRaises(ValueError):\n            merge_activities([indoor], [nike, nike])\n        collision = copy.deepcopy(nike)\n        collision[\"run_id\"] = 1\n        with self.assertRaises(ValueError):\n            merge_activities([indoor], [collision])\n\n    def test_cli_keeps_nrc_when_excel_is_reimported(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            tmp = Path(tmp)\n            cache = tmp / \"nike.json\"\n            cache.write_text(json.dumps([normalize_nike(example())]), encoding=\"utf-8\")\n            output, manifest = tmp / \"combined.json\", tmp / \"source.json\"\n            command = [sys.executable, str(ROOT / \"scripts/import_excel.py\"),\n                str(ROOT / \"scripts/tests/fixtures/Running_Log_V1.1.xlsx\"),\n                \"--nike-data\", str(cache), \"--output\", str(output), \"--manifest\", str(manifest)]\n            for _ in range(2):\n                result = subprocess.run(command, capture_output=True, text=True)\n                self.assertEqual(result.returncode, 0, result.stderr)\n                rows = json.loads(output.read_text())\n                self.assertEqual(len(rows), 3)\n                self.assertEqual(sum(row[\"source\"] == \"nike\" for row in rows), 1)\n                self.assertEqual(sum(row[\"summary_polyline\"] is None for row in rows), 2)\n                info = json.loads(manifest.read_text())\n                self.assertAlmostEqual(info[\"distance_miles\"], 21.7)\n                self.assertEqual(info[\"sources\"], {\"excel\": 2, \"nike\": 1})\n            cache.write_text('{\"invalid\":true}')\n            previous = output.read_bytes()\n            result = subprocess.run(command, capture_output=True, text=True)\n            self.assertNotEqual(result.returncode, 0)\n            self.assertEqual(output.read_bytes(), previous)\n\nif __name__ == \"__main__\":\n    unittest.main()\n",".github/workflows/nike-sync.yml":"name: Sync Nike Run Club\n\non:\n  workflow_dispatch:\n\nconcurrency:\n  group: nike-sync\n  cancel-in-progress: false\n\npermissions:\n  contents: write\n  pages: write\n  id-token: write\n\njobs:\n  sync:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: master\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - run: python -m pip install openpyxl==3.1.5\n      - name: Verify import behavior\n        run: python -m unittest discover -s scripts/tests -v\n      - name: Download NRC runs\n        env:\n          NIKE_ACCESS_TOKEN: \u0024{{ secrets.NIKE_ACCESS_TOKEN }}\n        run: python scripts/sync_nike.py\n      - name: Merge indoor and outdoor runs\n        run: python scripts/import_excel.py Running_Log_EN.xlsx --nike-data src/static/nike-activities.json\n      - name: Save updated running data\n        run: |\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add src/static/nike-activities.json src/static/activities.json src/static/data-source.json\n          git add --all -- activities GPX_OUT\n          if ! git diff --cached --quiet; then\n            git commit -m \"data: sync NRC outdoor runs\"\n            git push origin HEAD:master\n          fi\n  publish:\n    needs: sync\n    uses: ./.github/workflows/gh-pages.yml\n    secrets: inherit\n","src/static/nike-activities.json":"[]\n","docs/superpowers/specs/2026-10-28-nrc-outdoor-design.md":"# NRC outdoor data integration\n\nUse the existing Nike API endpoints and the original Dashboard Activity contract. Preserve the current mile-based Excel importer for indoor runs. Fetch NRC outdoor runs directly with NIKE_ACCESS_TOKEN from GitHub Actions Secrets. Keep real GPS routes and active duration, use America/New_York dates, and never invent indoor GPS or heart rate. Persist NRC input separately so subsequent Excel uploads retain outdoor history.\n\nApproaches: direct Nike API follows the user-selected upstream integration and can import existing Nike history. Strava is an alternative but the official Nike connection does not backfill earlier activities. Manual Excel entry loses outdoor GPS and is reserved for treadmill runs.\n\nThe token is temporary and the existing upstream script does not refresh it automatically. Provide a manual Sync Nike Run Club workflow; updating Excel continues to publish automatically using the last successfully imported NRC data. Leave Dashboard components and styles untouched.\n\nVerification: failing regression test before implementation; nine Python tests; live Nike response; combined real data; Node unit tests; production build; deployed public page.\n","docs/superpowers/plans/2026-10-28-nrc-outdoor.md":"# NRC Outdoor Import Implementation Plan\n\n> For agentic workers: execute the approved direct-Nike integration inline.\n\nGoal: Show NRC outdoor runs with real GPS alongside existing Excel treadmill records on GitHub Pages.\nArchitecture: A small adapter follows upstream Nike endpoints and metrics. A persistent NRC JSON input is merged when Excel is imported. A manual Actions workflow refreshes NRC, commits data and calls the Pages workflow.\nTech Stack: Python 3.12 standard library, openpyxl 3.1.5, existing React Dashboard and GitHub Actions.\nSpec: docs/superpowers/specs/2026-10-28-nrc-outdoor-design.md\n\n## Constraints\n- Publish to zephyryuewu-creator/run and its existing GitHub Pages URL.\n- Preserve Dashboard components, CSS and the existing mile display.\n- Credentials stay in Actions Secrets and never enter public source, JSON or logs.\n- Preserve Excel indoor records and use actual NRC GPS only.\n\n## Review Focus\n- Cached outdoor runs survive later Excel uploads.\n- Refreshing NRC does not duplicate the same Nike activity.\n- Nike API errors do not overwrite the prior valid input.\n- UTC to New York date conversion remains correct across date boundaries.\n- Invalid or mismatched GPS points never create a fabricated route.\n\n## Tasks\n- [x] Verify credentials with the Nike API and save NIKE_ACCESS_TOKEN as a repository Secret.\n- [x] Add regression tests first and observe missing nike_data fail on GitHub Actions (40748832129).\n- [ ] Implement normalization, GPX export, validation and deterministic dataset merge.\n- [ ] Add secret-backed NRC workflow and update Pages to merge persisted NRC input.\n- [ ] Run Python and Node checks, import the real NRC activity, and verify production build on the branch.\n- [ ] Review the resulting diff, merge and verify the public Dashboard contains both data sources.\n\nRuling: Use a separate GitHub branch for implementation and run checks on GitHub, honoring the request to work on the repository and its hosted preview.\nRuling: Retain the latest successful NRC import independently of token expiry; renew the token only when fetching new NRC records.\n\nReview: preserve reusable-workflow secrets with secrets: inherit. All Python tests, real NRC import and frontend build passed in 40749866516. GitHub App cannot push workflow edits; apply those through the authenticated GitHub UI. Deferred minor: HTTP pagination/error paths lack mock regression tests; previously exported GPX files are retained if a later activity loses GPS.\n","docs/NRC_SYNC.md":"# NRC outdoor runs and Excel treadmill runs\n\nThe existing Dashboard reads a combined Activity dataset. Distance is displayed in miles and pace in min/mi. Excel remains the source for indoor treadmill records; NRC supplies real outdoor GPS.\n\n## Import a new NRC run\n1. Sign in to nike.com with the same account used by NRC. Follow upstream README “Nike Run Club New” to obtain your current access_token.\n2. Save the complete token as repository Actions Secret NIKE_ACCESS_TOKEN.\n3. Open Actions → Sync Nike Run Club → Run workflow on master.\n4. Wait for both the sync job and the GitHub Pages publishing job to succeed, then refresh your public website.\n\nThis is a temporary access token. It does not automatically refresh; if Nike returns HTTP 401, replace the Secret with a current token and rerun the workflow. Updating a Secret alone does not start a sync. The code never embeds the token in source or generated running data.\n\n## Files\n- Running_Log_EN.xlsx: your cumulative indoor log. Uploading a replacement on master continues to publish automatically.\n- src/static/nike-activities.json: last successfully imported NRC records. Kept when Excel is updated or Nike credentials expire.\n- src/static/activities.json: combined normalized Activity dataset. Also regenerated during Pages builds.\n- activities/nike-*.json: archived activity measurements, with authentication/session fields excluded.\n- GPX_OUT/nike-*.gpx: actual timestamped outdoor GPS routes.\n- scripts/sync_nike.py: Nike download, following upstream endpoints.\n- scripts/nike_data.py: units, dates, GPS normalization and deterministic merge.\n\nRuns are distinguished by stable source-specific record IDs. Re-running the import does not add duplicates. Do not also enter the same NRC outdoor run into the indoor Excel log. Missing GPS, heart rate and country remain unknown; no indoor route is fabricated. The original China footprint map remains unchanged. Mapbox basemap configuration is separate from importing GPS routes.\n\nReferences: https://github.com/yihong0618/running_page#nike-run-club-new and https://github.com/yihong0618/running_page/issues/692\n"}''')
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          path = Path("scripts/import_excel.py")
          source = path.read_text(encoding="utf-8")
          old = json.loads(r'''"    args = parser.parse_args()\n    try:\n        activities, manifest = import_workbook(args.workbook)\n"''')
          new = json.loads(r'''"    parser.add_argument(\"--nike-data\", type=Path, help=\"Persisted NRC input to merge with indoor Excel\")\n    args = parser.parse_args()\n    try:\n        activities, manifest = import_workbook(args.workbook)\n        if args.nike_data is not None:\n            from nike_data import merge_activities\n            nike_rows = json.loads(args.nike_data.read_text(encoding=\"utf-8\"))\n            indoor_count = len(activities)\n            activities = merge_activities(activities, nike_rows)\n            manifest.update({\n                \"sources\": {\"excel\": indoor_count, \"nike\": len(nike_rows)},\n                \"nike_input_file\": args.nike_data.name,\n                \"nike_input_sha256\": hashlib.sha256(args.nike_data.read_bytes()).hexdigest(),\n                \"record_count\": len(activities),\n                \"distance_miles\": round(sum(row[\"distance\"] for row in activities) / METERS_PER_MILE, 6),\n                \"duration_seconds\": sum(round(row[\"distance\"] / row[\"average_speed\"]) for row in activities),\n            })\n"''')
          if source.count(old) != 1:
              raise RuntimeError("Excel importer changed; refusing an ambiguous patch")
          source = source.replace(old, new)
          source = source.replace('except (ValueError, OSError, KeyError) as error:', 'except (ValueError, OSError, KeyError, TypeError) as error:')
          path.write_text(source, encoding="utf-8")
          path = Path(".github/workflows/gh-pages.yml")
          source = path.read_text(encoding="utf-8")
          old = 'run: python scripts/import_excel.py Running_Log_EN.xlsx'
          if source.count(old) != 1:
              raise RuntimeError("Pages workflow changed; refusing an ambiguous patch")
          source = source.replace(old, old + ' --nike-data src/static/nike-activities.json')
          path.write_text(source, encoding="utf-8")
          
          PY
      - name: Verify all Python import tests (GREEN)
        run: python -m unittest discover -s scripts/tests -v
      - name: Import your NRC outdoor runs
        env:
          NIKE_ACCESS_TOKEN: ${{ secrets.NIKE_ACCESS_TOKEN }}
        run: python scripts/sync_nike.py
      - name: Verify combined real dataset
        run: |
          python scripts/import_excel.py Running_Log_EN.xlsx --nike-data src/static/nike-activities.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("src/static/activities.json").read_text())
          indoor = [row for row in rows if row["source"] == "manual_excel_treadmill"]
          outdoor = [row for row in rows if row["source"] == "nike"]
          assert len(indoor) == 3, "All three Excel records must be preserved"
          assert len(outdoor) >= 1, "NRC run must be present"
          assert any(row["summary_polyline"] for row in outdoor), "Real outdoor GPS must be present"
          assert all(row["summary_polyline"] is None for row in indoor), "Indoor runs must keep missing GPS"
          print(json.dumps({"indoor":len(indoor), "nrc":len(outdoor), "total":len(rows), "miles":sum(row["distance"] for row in rows)/1609.344}))
          PY
