name: Verify US footprint map
on:
  push:
    branches: [feat-us-footprint]
    paths: [.github/workflows/us-footprint-verify.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Keep GPS regression input independent of future run uploads
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture = Path('tests/fixtures/nrc-georgia.json')
          fixture.parent.mkdir(parents=True, exist_ok=True)
          if not fixture.exists():
              records = json.loads(Path('src/static/nike-activities.json').read_text())
              record = next(a for a in records if a.get('nike_activity_id') == 'd747119f-a236-484a-b8af-bb23e258acc7')
              fixture.write_text(json.dumps([{'summary_polyline':record['summary_polyline']}], indent=2) + '\n')
          test = Path('tests/us-states.test.mjs')
          test.write_text(test.read_text().replace('../src/static/nike-activities.json', './fixtures/nrc-georgia.json'))
          Path('tsconfig.us-footprint-check.json').write_text(json.dumps({'extends':'./tsconfig.json','include':['src/themes/dashboard/index.tsx','src/components/USMap.tsx','src/components/ProfileCard.tsx','src/core/usStates.ts','vite-env.d.ts']}))
          plan = Path('docs/superpowers/plans/2026-10-28-us-footprint.md')
          plan.write_text(plan.read_text().replace('- [ ] Run state tests', '- [x] Run state tests') + '\nValidation: GitHub Actions 40763944282 passed Node 24 Dashboard typing/lint and builds on Node 24 and Node 20. The fixed GPS fixture prevents future NRC uploads changing the regression test input.\n')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Verify Node 24
        env:
          PATH_PREFIX: /run
        run: |
          pnpm exec prettier --write tests/us-states.test.mjs tests/fixtures/nrc-georgia.json
          node --test tests/us-states.test.mjs tests/units.test.mjs
          pnpm exec tsc --noEmit --project tsconfig.us-footprint-check.json
          pnpm exec eslint src/core/usStates.ts src/components/USMap.tsx src/components/ProfileCard.tsx src/themes/dashboard/index.tsx
          pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Node 20
        env:
          PATH_PREFIX: /run
        run: pnpm build
      - name: Commit stable regression fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/us-states.test.mjs tests/fixtures/nrc-georgia.json docs/superpowers/plans/2026-10-28-us-footprint.md
          git commit -m 'test: keep state regression independent of new NRC uploads'
          git push origin HEAD:feat-us-footprint
