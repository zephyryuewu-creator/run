name: Format NRC integration

on:
  push:
    branches: [nrc-outdoor]
    paths: [.github/workflows/nrc-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black ruff openpyxl==3.1.5
      - name: Keep standalone test discovery imports explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/tests/test_nike_import.py")
          source = path.read_text()
          if not source.startswith("# ruff: noqa: E402"):
              path.write_text("# ruff: noqa: E402\n" + source)
          PY
      - name: Format and lint changed Python files
        run: |
          black scripts/import_excel.py scripts/nike_data.py scripts/sync_nike.py scripts/tests/test_nike_import.py
          ruff check scripts/import_excel.py scripts/nike_data.py scripts/sync_nike.py scripts/tests/test_nike_import.py
      - name: Verify all imports after formatting
        run: python -m unittest discover -s scripts/tests -v
      - name: Save formatted code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/import_excel.py scripts/nike_data.py scripts/sync_nike.py scripts/tests/test_nike_import.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style: format and lint NRC import code"
            git push origin HEAD:nrc-outdoor
          fi
