name: Publish GitHub Pages

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    paths:
      - Running_Log_EN.xlsx
      - scripts/import_excel.py
      - scripts/tests/**
      - tests/**
      - src/**
      - config.yml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/gh-pages.yml

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5
      - name: Verify Excel conversion
        run: python -m unittest discover -s scripts/tests -v
      - name: Import personal workbook
        run: python scripts/import_excel.py Running_Log_EN.xlsx
      - name: Verify mile and date formatting
        run: node --test tests/units.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: pnpm build
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-artifact
          path: ./dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact
