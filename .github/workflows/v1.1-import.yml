name: Import V1.1 data

on:
  push:
    branches: [v1.1-data]
    paths: [.github/workflows/v1.1-import.yml]

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'zephyryuewu-creator/run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed V1.1 patch
        env:
          V11_PATCH: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          digest = lambda b: hashlib.sha256(b).hexdigest()
          compressed = base64.b64decode(os.environ['V11_PATCH'], validate=True)
          assert digest(compressed) == '5236d6ba8685007ec3bcc43ff299dd75a514a6286acb3141a4b0bf9ff78e5a87', 'Patch checksum mismatch'
          payload = json.loads(gzip.decompress(compressed))
          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base'], 'HEAD'], check=True)
          root = Path.cwd().resolve()
          def target(name):
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
              result = root.joinpath(*path.parts)
              assert result.resolve().is_relative_to(root)
              return result
          pending = {}
          for name, item in payload['files'].items():
              path = target(name)
              old = path.read_bytes() if path.exists() else b''
              assert digest(old) == item['old'], f'Existing file changed: {name}'
              lines = old.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert digest(new) == item['new'], f'Result checksum mismatch: {name}'
              pending[path] = new
          for name, expected in payload['delete'].items():
              assert digest(target(name).read_bytes()) == expected, f'Deletion target changed: {name}'
          workbook = (root / 'Running_Log_EN.xlsx').read_bytes()
          assert digest(workbook) == 'ec5d169cb1a9baac991d0f58dd0d9d237c1fac069e25df51865c0267ebbca78d', 'Workbook changed'
          pending[target('scripts/tests/fixtures/Running_Log_V1.1.xlsx')] = workbook
          for path, content in pending.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          for name in payload['delete']:
              target(name).unlink()
          print(f'Applied {len(pending)} files; removed {len(payload["delete"])} copied author data files.')
          PY
      - name: Validate and import Excel
        run: |
          python -m pip install openpyxl==3.1.5
          python -m unittest discover -s scripts/tests -v
          python scripts/import_excel.py Running_Log_EN.xlsx
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify miles and dates
        run: node --test tests/units.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Check and build the original Dashboard
        env:
          PATH_PREFIX: /run
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit verified V1.1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'V1.1: import Yue Excel runs into the original Dashboard'
          git push origin HEAD:v1.1-data
