name: Sync Nike Run Club

on:
  workflow_dispatch:

concurrency:
  group: nike-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Verify import behavior
        run: python -m unittest discover -s scripts/tests -v
      - name: Download NRC runs
        env:
          NIKE_ACCESS_TOKEN: ${{ secrets.NIKE_ACCESS_TOKEN }}
        run: python scripts/sync_nike.py
      - name: Merge indoor and outdoor runs
        run: python scripts/import_excel.py Running_Log_EN.xlsx --nike-data src/static/nike-activities.json
      - name: Save updated running data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/static/nike-activities.json src/static/activities.json src/static/data-source.json
          git add --all -- activities GPX_OUT
          if ! git diff --cached --quiet; then
            git commit -m "data: sync NRC outdoor runs"
            git push origin HEAD:master
          fi
  publish:
    needs: sync
    uses: ./.github/workflows/gh-pages.yml
    secrets: inherit
